name: san3a_flutter
description: "A cross-platform Flutter application migrated from the San3a Android Kotlin codebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Backend & APIs
  http: ^1.2.2
  
  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.3
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  
  # Location & Maps
  geolocator: ^13.0.1
  google_maps_flutter: ^2.10.0
  
  # Storage
  shared_preferences: ^2.3.2
  
  # Navigation
  go_router: ^14.2.7
  
  # UI & Assets
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
